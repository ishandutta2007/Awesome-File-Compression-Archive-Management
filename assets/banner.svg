<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12px;
      fill: #cbd5e1;
    }

    /* Ambient Dynamic Pulsing */
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes pulse-purple {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(25px, -20px); opacity: 0.55; }
    }
    @keyframes float-data {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .ambient-orb-1 {
      animation: pulse-slow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-orb-2 {
      animation: pulse-purple 10s ease-in-out infinite;
      transform-origin: 1000px 300px;
    }
    .float-node {
      animation: float-data 5s ease-in-out infinite;
    }
    .flowing-line {
      stroke-dasharray: 6 6;
      animation: dash-flow 12s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />

  <!-- Ambient Dynamic Lighting Orbs in Background -->
  <circle class="ambient-orb-1" cx="200" cy="80" r="140" fill="#0284c7" filter="url(#soft-blur)" />
  <circle class="ambient-orb-2" cx="1020" cy="320" r="160" fill="#7c3aed" filter="url(#soft-blur)" />
  <circle cx="650" cy="50" r="100" fill="#0d9488" opacity="0.2" filter="url(#soft-blur)" />

  <!-- Grid overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Flowing Dynamic Background Connection Streams -->
  <g opacity="0.35">
    <path class="flowing-line" d="M 50 340 C 250 300, 350 380, 550 330 C 750 280, 950 370, 1150 320" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flowing-line" d="M 50 70 C 300 120, 500 40, 800 90 C 950 120, 1050 60, 1150 80" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Compression Graphic / Flow on the Right -->
  <g class="float-node" transform="translate(850, 110)">
    <!-- Original Large Data block -->
    <rect x="0" y="25" width="70" height="130" rx="8" fill="url(#card-grad)" stroke="#475569" stroke-width="1.5"/>
    <line x1="15" y1="50" x2="55" y2="50" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="65" x2="55" y2="65" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="80" x2="55" y2="80" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="95" x2="55" y2="95" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="110" x2="55" y2="110" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <line x1="15" y1="125" x2="40" y2="125" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <text x="35" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">RAW (10x)</text>

    <!-- Compression Process Vectors -->
    <path d="M 85 90 L 135 90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <polygon points="140,90 130,84 130,96" fill="#38bdf8" />
    <text x="110" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">COMPRESS</text>

    <!-- Compressed Small Data block -->
    <rect x="155" y="55" width="55" height="70" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <rect x="170" y="75" width="25" height="4" rx="2" fill="#38bdf8"/>
    <rect x="170" y="85" width="25" height="4" rx="2" fill="#38bdf8"/>
    <rect x="170" y="95" width="15" height="4" rx="2" fill="#38bdf8"/>
    <text x="182" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">.ZST / .7Z</text>
  </g>

  <!-- Foreground Content: Header Tag, Title, Subtitle, Feature Pills -->
  <!-- Category Tag -->
  <g transform="translate(80, 85)">
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="15" cy="15" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="20" class="badge-text">HIGH-PERFORMANCE COMPRESSION</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="165" class="title">Awesome File Compression</text>
  <text x="80" y="215" class="title" fill="#38bdf8" opacity="0.95">&amp; Archive Management</text>

  <!-- Subtitle -->
  <text x="80" y="260" class="subtitle">The definitive directory of high-ratio algorithms, CLI archivers, GUI managers &amp; cloud utilities.</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 305)">
    <!-- Pill 1: Zstandard / zstd -->
    <rect x="0" y="0" width="105" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="52" y="20" text-anchor="middle" class="pill-text">⚡ Zstandard</text>

    <!-- Pill 2: 7-Zip & LZMA -->
    <rect x="115" y="0" width="100" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="165" y="20" text-anchor="middle" class="pill-text">📦 7z &amp; LZMA</text>

    <!-- Pill 3: Brotli -->
    <rect x="225" y="0" width="85" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="267" y="20" text-anchor="middle" class="pill-text">🌐 Brotli</text>

    <!-- Pill 4: WebAssembly -->
    <rect x="320" y="0" width="125" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="382" y="20" text-anchor="middle" class="pill-text">🚀 WebAssembly</text>

    <!-- Pill 5: Cloud SaaS -->
    <rect x="455" y="0" width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="512" y="20" text-anchor="middle" class="pill-text">☁️ Cloud SaaS</text>
  </g>
</svg>
