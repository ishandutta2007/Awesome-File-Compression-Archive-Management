<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#6366f1" stop-opacity=".6"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".4"/></linearGradient><linearGradient id="accent-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-blur" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur stdDeviation="30"/></filter></defs><style>@keyframes pulse-slow{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(-20px,15px);opacity:.6}}@keyframes pulse-purple{0%{transform:scale(1) translate(0,0);opacity:.25}50%{transform:scale(1.2) translate(25px,-20px);opacity:.55}}@keyframes float-data{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes dash-flow{0%{stroke-dashoffset:100}}.badge-text,.pill-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.pill-text{font-weight:500;font-size:12px;fill:#cbd5e1}.ambient-orb-1{animation:pulse-slow 8s ease-in-out infinite;transform-origin:200px 100px}.ambient-orb-2{animation:pulse-purple 10s ease-in-out infinite;transform-origin:1000px 300px}.float-node{animation:float-data 5s ease-in-out infinite}.flowing-line{stroke-dasharray:6 6;animation:dash-flow 12s linear infinite}</style><rect width="1200" height="400" fill="url(#bg-grad)"/><circle cx="200" cy="80" r="140" fill="#0284c7" class="ambient-orb-1" filter="url(#soft-blur)"/><circle cx="1020" cy="320" r="160" fill="#7c3aed" class="ambient-orb-2" filter="url(#soft-blur)"/><circle cx="650" cy="50" r="100" fill="#0d9488" filter="url(#soft-blur)" opacity=".2"/><rect width="1200" height="400" fill="url(#grid)"/><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 340 C 250 300, 350 380, 550 330 C 750 280, 950 370, 1150 320" class="flowing-line"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 50 70 C 300 120, 500 40, 800 90 C 950 120, 1050 60, 1150 80" class="flowing-line"/></g><g class="float-node" transform="translate(850, 110)"><rect width="70" height="130" x="0" y="25" fill="url(#card-grad)" stroke="#475569" stroke-width="1.5" rx="8"/><line x1="15" x2="55" y1="50" y2="50" stroke="#64748b" stroke-linecap="round" stroke-width="2"/><line x1="15" x2="55" y1="65" y2="65" stroke="#64748b" stroke-linecap="round" stroke-width="2"/><line x1="15" x2="55" y1="80" y2="80" stroke="#64748b" stroke-linecap="round" stroke-width="2"/><line x1="15" x2="55" y1="95" y2="95" stroke="#64748b" stroke-linecap="round" stroke-width="2"/><line x1="15" x2="55" y1="110" y2="110" stroke="#64748b" stroke-linecap="round" stroke-width="2"/><line x1="15" x2="40" y1="125" y2="125" stroke="#64748b" stroke-linecap="round" stroke-width="2"/><text x="35" y="145" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">RAW (10x)</text><path stroke="#38bdf8" stroke-linecap="round" stroke-width="3" d="M 85 90 L 135 90"/><polygon fill="#38bdf8" points="140 90 130 84 130 96"/><text x="110" y="78" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">COMPRESS</text><rect width="55" height="70" x="155" y="55" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" rx="8"/><rect width="25" height="4" x="170" y="75" fill="#38bdf8" rx="2"/><rect width="25" height="4" x="170" y="85" fill="#38bdf8" rx="2"/><rect width="15" height="4" x="170" y="95" fill="#38bdf8" rx="2"/><text x="182" y="115" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">.ZST / .7Z</text></g><g transform="translate(80, 85)"><rect width="230" height="30" x="0" y="0" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" rx="15"/><circle cx="15" cy="15" r="5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.4;1"/></circle><text x="28" y="20" class="badge-text">HIGH-PERFORMANCE COMPRESSION</text></g><text x="80" y="165" class="title">Awesome File Compression</text><text x="80" y="215" fill="#38bdf8" class="title" opacity=".95">&amp; Archive Management</text><text x="80" y="260" class="subtitle">The definitive directory of high-ratio algorithms, CLI archivers, GUI managers &amp; cloud utilities.</text><g transform="translate(80, 305)"><rect width="105" height="32" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="52" y="20" class="pill-text" text-anchor="middle">⚡ Zstandard</text><rect width="100" height="32" x="115" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="165" y="20" class="pill-text" text-anchor="middle">📦 7z &amp; LZMA</text><rect width="85" height="32" x="225" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="267" y="20" class="pill-text" text-anchor="middle">🌐 Brotli</text><rect width="125" height="32" x="320" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="382" y="20" class="pill-text" text-anchor="middle">🚀 WebAssembly</text><rect width="115" height="32" x="455" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="16"/><text x="512" y="20" class="pill-text" text-anchor="middle">☁️ Cloud SaaS</text></g></svg>